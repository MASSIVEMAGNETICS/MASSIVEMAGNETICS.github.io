name: Deploy IAMBANDOBANDZ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Scan Frontier Radar public sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/frontier_radar.py --output frontier-radar/data/feed.json
      - name: Validate canonical registry
        run: python tools/validate_registry.py
      - name: Run registry tests
        run: python -m unittest discover -s tests -v
      - name: Build sanitized site from registry
        run: python tools/build_site.py --output _site
      - name: Include Frontier Radar public surface
        run: cp -R frontier-radar _site/frontier-radar
      - name: Validate built site
        run: python tools/validate_registry.py --site _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
