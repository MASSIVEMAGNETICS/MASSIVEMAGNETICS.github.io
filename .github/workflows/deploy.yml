name: Deploy IAMBANDOBANDZ

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Frontier Radar Refresh", "pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reconcile derived storefront state in deployment workspace
        run: |
          python tools/reconcile_store_state.py
          python tools/reconcile_store_state.py --check
          python store/validate_store.py
      - name: Validate canonical registry
        run: python tools/validate_registry.py
      - name: Run site tests
        run: python -m unittest discover -s tests -v
      - name: Validate committed Frontier Radar snapshot
        run: |
          if [ -f frontier-radar/data/feed.sha256 ]; then
            python tools/validate_frontier_feed.py frontier-radar/data/feed.json \
              --status frontier-radar/data/status.json \
              --digest frontier-radar/data/feed.sha256
          else
            echo "V1.2 digest not committed yet; refresh workflow will create it."
          fi
      - name: Build sanitized site from registry
        run: python tools/build_site.py --output _site
      - name: Include Frontier Radar public surface
        run: cp -R frontier-radar _site/frontier-radar
      - name: Validate built site
        run: python tools/validate_registry.py --site _site
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
