name: Frontier Radar Scan

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}frontier-radar/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Scan public frontier signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/frontier_radar.py --output frontier-radar/data/feed.json
      - name: Test radar
        run: python -m unittest tests.test_frontier_radar -v
      - name: Validate canonical registry
        run: python tools/validate_registry.py
      - name: Run site tests
        run: python -m unittest discover -s tests -v
      - name: Build sanitized site
        run: python tools/build_site.py --output _site
      - name: Include Frontier Radar public surface
        run: cp -R frontier-radar _site/frontier-radar
      - name: Validate built site
        run: python tools/validate_registry.py --site _site
      - name: Commit fresh evidence feed
        run: |
          if git diff --quiet -- frontier-radar/data/feed.json frontier-radar/data/status.json; then
            echo "No feed changes to commit."
          else
            git config user.name "massive-magnetics-radar[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- frontier-radar/data/feed.json frontier-radar/data/status.json
            git commit -m "chore(radar): refresh public frontier evidence"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
