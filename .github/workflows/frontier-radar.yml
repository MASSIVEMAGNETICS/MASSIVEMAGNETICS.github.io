name: Frontier Radar Refresh

on:
  push:
    branches: [main]
    paths:
      - "tools/frontier_radar.py"
      - "tools/validate_frontier_feed.py"
      - "tests/test_frontier_radar.py"
      - ".github/workflows/frontier-radar.yml"
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontier-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run radar tests
        run: python -m unittest tests.test_frontier_radar -v
      - name: Scan public frontier sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/frontier_radar.py --output frontier-radar/data/feed.json
      - name: Validate candidate snapshot
        run: |
          python tools/validate_frontier_feed.py frontier-radar/data/feed.json \
            --status frontier-radar/data/status.json \
            --digest frontier-radar/data/feed.sha256 \
            --max-age-hours 1
      - name: Commit verified snapshot
        run: |
          if git diff --quiet -- \
            frontier-radar/data/feed.json \
            frontier-radar/data/feed.sha256 \
            frontier-radar/data/status.json; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "massive-magnetics-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            frontier-radar/data/feed.json \
            frontier-radar/data/feed.sha256 \
            frontier-radar/data/status.json
          git commit -m "chore(radar): refresh verified V1.2 snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
