name: Validate Direct Store

on:
  push:
    branches: [main, "agent/**", "sync/**"]
    paths:
      - "store/**"
      - "assets/releases/**"
      - "tools/reconcile_store_state.py"
      - ".github/workflows/store.yml"
      - "CNAME"
  pull_request:
    paths:
      - "store/**"
      - "assets/releases/**"
      - "tools/reconcile_store_state.py"
      - ".github/workflows/store.yml"
      - "CNAME"

permissions:
  contents: read

jobs:
  validate-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile synchronization and validation gates
        run: python -m py_compile tools/reconcile_store_state.py store/validate_store.py
      - name: Prove committed state is reconciled
        run: python tools/reconcile_store_state.py --check
      - name: Verify storefront contract
        run: python store/validate_store.py
