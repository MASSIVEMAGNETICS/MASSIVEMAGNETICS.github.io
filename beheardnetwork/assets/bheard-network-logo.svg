  <g id="headphones">
    <path d="M64 128 V109 C64 75 89 56 120 56 C151 56 176 75 176 109 V128" fill="none" stroke="url(#silver)" stroke-width="11" stroke-linecap="round"/>
    <path d="M64 128 V109 C64 75 89 56 120 56 C151 56 176 75 176 109 V128" fill="none" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="51" y="109" width="25" height="55" rx="10" fill="url(#silver)" stroke="#D71920" stroke-width="3"/>
    <rect x="164" y="109" width="25" height="55" rx="10" fill="url(#silver)" stroke="#D71920" stroke-width="3"/>
    <path d="M56 121 H71 M169 121 H184" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="120" y="219" text-anchor="middle" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="900" letter-spacing="4">NETWORK</text>
</svg>
